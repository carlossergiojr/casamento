<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victoria & Carlos 💍</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at top, #f7fbff 0%, #e4f0fa 60%, #d2e6f5 100%);
      font-family: 'Cormorant Garamond', Georgia, serif; color: #3f5a73; text-align: center;
    }
    .card { position: relative; z-index: 2; padding: 2rem; animation: fadeUp 1.6s ease both; }
    .ring { font-size: 2.4rem; display: inline-block; animation: float 3s ease-in-out infinite; }
    h1 {
      font-family: 'Great Vibes', cursive; font-weight: normal;
      font-size: clamp(3rem, 12vw, 5.5rem); margin: .3rem 0; line-height: 1.4;
      color: #4f86b8; padding: 0 .3em;
    }
    .divider { width: 120px; height: 1px; margin: 1rem auto; background: linear-gradient(90deg, transparent, #8fbde2, transparent); }
    p { font-size: 1.25rem; font-style: italic; margin: .4rem 0; opacity: .85; }
    .soon { font-style: normal; letter-spacing: .35em; text-transform: uppercase; font-size: .8rem; margin-top: 1.4rem; opacity: .6; }
    .sparkle {
      position: fixed; pointer-events: none; color: #7fb8e6; z-index: 1; opacity: 0;
      animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--delay);
    }
    @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.3) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="ring">💍</div>
    <h1>Victoria &amp; Carlos</h1>
    <div class="divider"></div>
    <p>Nosso site está sendo preparado com carinho 🩵</p>
    <p class="soon">Em breve</p>
  </div>

  <script>
    // Brilhinhos piscando pela tela
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = Math.random() > .5 ? '✦' : '✧';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.fontSize = (8 + Math.random() * 16) + 'px';
      s.style.setProperty('--d', (2 + Math.random() * 3) + 's');
      s.style.setProperty('--delay', (Math.random() * 4) + 's');
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
