<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Presente — Pagamento</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&amp;family=Karla:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF7F1}
a{color:#4E5769}a:hover{color:#2B3140}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F1; color: #2B3140; font-family: 'Karla', sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column">
<nav style="height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E9EBEF">
<a href="Presente-Detalhe.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; text-decoration: none; font-size: 14px; color: #4E5769"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 3 L5 9 L11 15"></path></svg>Voltar</a>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #636E84">C &amp; V</span>
<span style="width: 60px"></span>
</nav>
<main style="padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; flex: 1">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #E9EBEF; border-radius: 3px">
<span style="display: flex; flex-direction: column"><span style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #4E5769">Seu presente</span><span style="font-size: 15px">[Nome do presente]</span></span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 26px; color: #9C7A45">R$ [valor]</span>
</div>

<div role="tablist" aria-label="Forma de pagamento" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #636E84; border-radius: 3px">
<sc-if value="{{isPix}}" hint-placeholder-val="{{true}}">
<button type="button" role="tab" aria-selected="true" onClick="{{showPix}}" style="height: 46px; border: 0; background: #636E84; color: #FFFFFF; font-family: 'Karla', sans-serif; font-size: 15px; font-weight: 600">Pix</button>
<button type="button" role="tab" aria-selected="false" onClick="{{showCard}}" style="height: 46px; border: 0; background: transparent; color: #636E84; font-family: 'Karla', sans-serif; font-size: 15px; font-weight: 600">Cartão</button>
</sc-if>
<sc-if value="{{isCard}}" hint-placeholder-val="{{false}}">
<button type="button" role="tab" aria-selected="false" onClick="{{showPix}}" style="height: 46px; border: 0; background: transparent; color: #636E84; font-family: 'Karla', sans-serif; font-size: 15px; font-weight: 600">Pix</button>
<button type="button" role="tab" aria-selected="true" onClick="{{showCard}}" style="height: 46px; border: 0; background: #636E84; color: #FFFFFF; font-family: 'Karla', sans-serif; font-size: 15px; font-weight: 600">Cartão</button>
</sc-if>
</div>

<sc-if value="{{isPix}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<div style="width: 200px; height: 200px; border: 1px dashed #9AA3B4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 0.14em; color: #4E5769">[QR CODE PIX]</div>
<p style="margin: 0; font-size: 14px; color: #4E5769">Abra o app do seu banco e escaneie, ou copie o código abaixo.</p>
<button type="button" style="width: 100%; padding: 15px; background: #636E84; color: #FFFFFF; border: 0; font-family: 'Karla', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 3px">Copiar código Pix</button>
<p style="margin: 0; font-size: 13px; color: #4E5769; display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #636E84"></span>Aguardando pagamento — esta tela atualiza sozinha</p>
</div>
</sc-if>

<sc-if value="{{isCard}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-num" style="font-size: 13px; color: #4E5769">Número do cartão</label>
<input id="c-num" type="text" inputmode="numeric" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #9AA3B4; background: #FFFFFF; font-family: 'Karla', sans-serif; font-size: 16px; border-radius: 3px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-nome" style="font-size: 13px; color: #4E5769">Nome impresso no cartão</label>
<input id="c-nome" type="text" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #9AA3B4; background: #FFFFFF; font-family: 'Karla', sans-serif; font-size: 16px; border-radius: 3px">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-val" style="font-size: 13px; color: #4E5769">Validade</label>
<input id="c-val" type="text" placeholder="MM/AA" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #9AA3B4; background: #FFFFFF; font-family: 'Karla', sans-serif; font-size: 16px; border-radius: 3px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-cvv" style="font-size: 13px; color: #4E5769">CVV</label>
<input id="c-cvv" type="text" inputmode="numeric" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #9AA3B4; background: #FFFFFF; font-family: 'Karla', sans-serif; font-size: 16px; border-radius: 3px">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-parc" style="font-size: 13px; color: #4E5769">Parcelas</label>
<select id="c-parc" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 10px; border: 1px solid #9AA3B4; background: #FFFFFF; font-family: 'Karla', sans-serif; font-size: 16px; border-radius: 3px"><option>[1x de R$ valor]</option></select>
</div>
</div>
</sc-if>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{isCard}}" hint-placeholder-val="{{false}}">
<a href="Presente-Obrigado.dc.html" style="display: block; text-align: center; padding: 15px; background: #636E84; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 3px">Pagar R$ [valor]</a>
</sc-if>
<sc-if value="{{isPix}}" hint-placeholder-val="{{true}}">
<a href="Presente-Obrigado.dc.html" style="text-align: center; font-size: 13px; min-height: 44px; display: flex; align-items: center; justify-content: center">(protótipo) simular pagamento aprovado</a>
</sc-if>
<p style="margin: 0; text-align: center; font-size: 12px; color: #4E5769">Pagamento seguro processado por [GATEWAY]</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { method: 'pix' }; }
renderVals() {
var pix = this.state.method === 'pix';
return {
isPix: pix, isCard: !pix,
showPix: () => this.setState({ method: 'pix' }),
showCard: () => this.setState({ method: 'card' })
};
}
}
</script>
</body>
</html>
