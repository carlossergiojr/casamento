# O site mora na Vercel. O GitHub Pages (carlossergiojr.github.io/casamento/, o endereço dos QR
# Codes impressos) só publica redirecionamento/: leva cada caminho antigo para o mesmo caminho
# no site novo (specs/006, contracts/redirecionamento.md).
name: Publicar redirecionamento no GitHub Pages

on:
  push:
    branches: [main]
    paths: [redirecionamento/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Endereço da Vercel preenchido
        run: |
          if grep -q "preencher.vercel.app" redirecionamento/*.html; then
            echo "Troque https://preencher.vercel.app pelo endereço real antes de publicar." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirecionamento

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
